<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim License - Gamut</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23D4FF00'/%3E%3Ctext x='16' y='23' font-family='Arial Black,sans-serif' font-size='20' font-weight='900' text-anchor='middle' fill='%23141414'%3EG%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem("gamut.theme") === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (e) { }
        })();
    </script>
    <style>
        .claim-container {
            max-width: 600px;
            margin: 10vh auto;
            padding: 2rem;
            background: var(--surface-1);
            border-radius: 8px;
            border: 1px solid var(--line);
        }
        .claim-code {
            padding: 1.5rem;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 6px;
            margin: 2rem 0;
            font-size: 1.1rem;
            word-break: break-all;
            text-align: center;
        }
        .loading {
            opacity: 0.7;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="index.html" class="logo wordmark"><span class="wm-text">Gamut</span><span class="logo-dot wm-dot">.</span></a>
    </nav>
    <main>
        <div class="claim-container">
            <h2>Claim your license</h2>
            <div id="claim-content">
                <p class="loading">Loading your license... please wait.</p>
            </div>
            <p class="hint" style="margin-top: 2rem; border-top: 1px solid var(--line); padding-top: 1rem;">
                Trouble claiming? Email <a href="mailto:hello@gamut.studio">hello@gamut.studio</a> with your payment ID.
            </p>
        </div>
    </main>
    <script>
        async function fetchLicense() {
            const content = document.getElementById('claim-content');
            const urlParams = new URLSearchParams(window.location.search);
            // Support Razorpay's append format like ?razorpay_payment_id=xxx or ?ref=xxx
            const ref = urlParams.get('ref') || urlParams.get('razorpay_payment_id') || urlParams.get('razorpay_subscription_id');
            
            if (!ref) {
                content.innerHTML = '<p style="color: var(--brand);">Error: No payment reference found in URL. Please check your receipt email for the link.</p>';
                return;
            }

            try {
                const res = await fetch('https://gamut-api.vyommehta197.workers.dev/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ref: ref })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    content.innerHTML = `
                        <p>Thank you! Your payment was successful. Here is your license code for the <strong>${data.tier}</strong> plan:</p>
                        <div class="claim-code mono">
                            ${data.code}
                        </div>
                        <a href="index.html#pricing" class="btn btn-primary" style="display: block; text-align: center;">Redeem your code</a>
                    `;
                } else if (res.status === 404) {
                    content.innerHTML = `
                        <p>Waiting for Razorpay to process your payment...</p>
                        <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 1rem;">Refresh and try again</button>
                        <p class="hint">Usually takes less than 60 seconds.</p>
                    `;
                } else {
                    content.innerHTML = `<p style="color: var(--brand);">Error: ${data.error}</p>`;
                }
            } catch (err) {
                content.innerHTML = `<p style="color: var(--brand);">Network error while claiming. Please try again.</p>`;
            }
        }
        
        fetchLicense();
    </script>
</body>
</html>

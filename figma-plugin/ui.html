<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg: #1A1A1A;
      --fg: #F2F2F2;
      --muted: #888888;
      --lime: #D4FF00;
      --border: #333333;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .tab.active {
      color: var(--fg);
      border-bottom-color: var(--lime);
    }
    .panel {
      display: none;
      padding: 16px;
    }
    .panel.active {
      display: block;
    }
    button.primary {
      background: var(--lime);
      color: #000;
      border: none;
      padding: 10px 16px;
      width: 100%;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    button.primary:hover {
      opacity: 0.9;
    }
    button.secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 10px 16px;
      width: 100%;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    button.secondary:hover {
      background: rgba(255,255,255,0.05);
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 140px;
      background: #111;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    textarea:focus {
      outline: 1px solid var(--lime);
      border-color: var(--lime);
    }
    .muted {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-target="extract">Extract</div>
    <div class="tab" data-target="apply">Apply</div>
  </div>

  <div id="extract" class="panel active">
    <p style="margin-top:0;">Scan the active selection (or current page) and copy the inventory to paste into Gamut.</p>
    <button class="primary" id="btn-copy">Copy Inventory</button>
    <button class="secondary" id="btn-download">Download .json</button>
    <div class="muted" id="extract-status"></div>
  </div>

  <div id="apply" class="panel">
    <p style="margin-top:0;">Paste Gamut's exported DTCG JSON to instantly generate your local Figma variables and styles.</p>
    <textarea id="dtcg-input" placeholder="{ &quot;gamut&quot;: { ... } }"></textarea>
    <button class="primary" id="btn-apply">Apply to Figma</button>
    <div class="muted" id="apply-status"></div>
  </div>

  <script>
    // Tab Switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    let currentInventory = null;

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (msg.type === 'inventory-ready') {
        currentInventory = msg.data;
        document.getElementById('extract-status').innerText = `Scanned ${msg.data.source.nodeCount} nodes.`;
      } else if (msg.type === 'apply-success') {
        document.getElementById('apply-status').innerText = 'Applied successfully!';
        setTimeout(() => { document.getElementById('apply-status').innerText = ''; }, 3000);
      } else if (msg.type === 'apply-error') {
        document.getElementById('apply-status').innerText = 'Error: ' + msg.error;
        document.getElementById('apply-status').style.color = '#ff4444';
      }
    };

    document.getElementById('btn-copy').onclick = () => {
      if (!currentInventory) {
        document.getElementById('extract-status').innerText = 'Scanning...';
        parent.postMessage({ pluginMessage: { type: 'request-scan' } }, '*');
      } else {
        copyToClipboard(JSON.stringify(currentInventory, null, 2));
      }
    };

    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      document.getElementById('extract-status').innerText = 'Copied to clipboard!';
      setTimeout(() => { document.getElementById('extract-status').innerText = ''; }, 3000);
    }

    document.getElementById('btn-download').onclick = () => {
      if (currentInventory) {
        const blob = new Blob([JSON.stringify(currentInventory, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gamut.inventory.v1.json';
        a.click();
        URL.revokeObjectURL(url);
      }
    };

    document.getElementById('btn-apply').onclick = () => {
      const text = document.getElementById('dtcg-input').value;
      if (!text.trim()) return;
      try {
        const json = JSON.parse(text);
        document.getElementById('apply-status').innerText = 'Applying...';
        document.getElementById('apply-status').style.color = '';
        parent.postMessage({ pluginMessage: { type: 'apply-dtcg', data: json } }, '*');
      } catch (e) {
        document.getElementById('apply-status').innerText = 'Invalid JSON';
        document.getElementById('apply-status').style.color = '#ff4444';
      }
    };

    // Initial scan request on load
    parent.postMessage({ pluginMessage: { type: 'request-scan' } }, '*');
  </script>
</body>
</html>
